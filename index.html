<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>LANI Academy — Integrated Learning & Professional Development Platform</title>
    <meta name="description" content="LANI Academy is Nigeria's integrated learning and training marketplace. Build future-ready capability with certified courses, corporate training, bootcamps, and professional development programmes across finance, ESG, digital transformation, agribusiness and more.">
    <meta name="keywords" content="LANI Academy, LANI, professional development Nigeria, corporate training Lagos, certification courses Nigeria, ESG training, digital transformation course, agribusiness training, finance compliance course, online learning Nigeria, capacity building, LANI Group">
    <meta name="author" content="LANI Group">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://academy.lani.ng/">

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LANI Academy">
    <meta property="og:title" content="LANI Academy — Integrated Learning & Professional Development Platform">
    <meta property="og:description" content="Build future-ready capability with certified courses, corporate training, bootcamps, and professional development programmes. Nigeria's leading capacity building marketplace.">
    <meta property="og:url" content="https://academy.lani.ng/">

    <meta property="og:locale" content="en_GB">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LANI Academy — Integrated Learning & Training Marketplace">
    <meta name="twitter:description" content="Nigeria's leading professional development platform. Certified courses in finance, ESG, digital transformation, agribusiness and more.">
    <meta name="twitter:image" content="https://academy.lani.ng/og-image.png">

    <!-- Theme & Branding -->
    <meta name="theme-color" content="#0f2442">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "LANI Academy",
      "alternateName": "LANI",

      "logo": "https://academy.lani.ng/favicon.svg",
      "description": "Nigeria's integrated learning and training marketplace offering certified courses, corporate training, bootcamps, and professional development programmes across high-impact sectors.",

        "@type": "PostalAddress",
        "streetAddress": "53B, Adekunle Fajuyi Way",
        "addressLocality": "Ikeja GRA, Lagos",
        "addressCountry": "NG"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "info@lani.ng",
        "contactType": "customer service"
      },
      "parentOrganization": {
        "@type": "Organization",
        "name": "LANI Group",
        "url": "https://lani.ng"
      },
      "sameAs": [
        "https://www.linkedin.com/company/lani-group"
      ]
    }
